schema_version = 1

[[invariants]]
id = "policy-not-implementation"
scope = "common"
statement = "OpencodeContract owns shared policy and compatibility contracts, not complete OpenCode configuration implementations."

[[invariants]]
id = "consumer-implementation-ownership"
scope = "common"
statement = "dotnix and Templates remain implementation owners of their respective profiles."

[[invariants]]
id = "model-alias-only"
scope = "common"
statement = "Role assignments reference canonical model aliases rather than provider model literals."

[[invariants]]
id = "single-configured-model"
scope = "common"
statement = "Each applicable role has exactly one configured model."

[[invariants]]
id = "model-substitution-forbidden"
scope = "common"
statement = "Availability, quota, rate-limit, and usage-limit failures never change the configured role or model identity."

[[invariants]]
id = "alternate-model-retry-forbidden"
scope = "common"
statement = "A bounded objective is never retried under another model."

[[invariants]]
id = "availability-fail-closed"
scope = "common"
statement = "If the configured model cannot execute the objective, the role returns BLOCKED."

[[invariants]]
id = "exact-model-failure-reporting"
scope = "common"
statement = "Availability failure reports the exact configured provider and model failure."

[[invariants]]
id = "fallback-agents-forbidden"
scope = "common"
statement = "Neither profile includes model-substitution fallback agents."

[[invariants]]
id = "consumer-audit-read-only"
scope = "common"
statement = "Consumer auditing observes dotnix and Templates without modifying either repository."

# The permission-semantics policy is normative; these linked entries are the
# cross-consumer invariant anchors required by that policy.
[[invariants]]
id = "bounded-safety-semantics-canonical"
scope = "common"
contract = "permission-semantics"
statement = "OpencodeContract canonically defines bounded cross-consumer permission safety semantics while complete permission maps remain intentionally consumer-owned and noncanonical."

[[invariants]]
id = "permission-map-implementation-owned"
scope = "common"
contract = "permission-semantics"
statement = "Consumers own complete permission maps, OpenCode glob and pattern spelling, prompt wording, guarded APIs, Task lifecycle, and provider, UI, and machine details."

[[invariants]]
id = "leaf-no-direct-ask-execution-permission-mutation"
scope = "common"
contract = "permission-semantics"
statement = "A non-interactive leaf never directly issues Ask, executes a denied or approval-required operation, or mutates permissions."

[[invariants]]
id = "no-permission-bypass"
scope = "common"
contract = "permission-semantics"
statement = "No parent or leaf bypasses a required allow, ask, deny, authority, or escalation decision."

[[invariants]]
id = "parent-independent-reevaluation-no-relay"
scope = "common"
contract = "permission-semantics"
statement = "The approval-capable parent independently reevaluates every leaf escalation request, never auto-approves it, and the leaf returns an outcome rather than relaying an Ask."

[[invariants]]
id = "out-of-authority-blocked"
scope = "common"
contract = "permission-semantics"
statement = "An operation outside the configured authority, including an unknown class, profile, or authority, returns BLOCKED."

[[invariants]]
id = "user-rejection-exact-operation-final"
scope = "common"
contract = "permission-semantics"
statement = "A user's rejection is final for the exact operation within the task; retry, rephrase, redelegation, and an equivalent substitute cannot bypass it."

[[invariants]]
id = "needs-approval-minimum"
scope = "common"
contract = "permission-semantics"
statement = "NEEDS_APPROVAL is the minimum non-terminal outcome for a bounded approval-required operation; it grants no execution authority and returns to an approval-capable parent."

[[invariants]]
id = "needs-decision-not-approval"
scope = "common"
contract = "permission-semantics"
statement = "NEEDS_DECISION is reserved for unresolved requirements, product, or architecture ambiguity requiring human judgment; it is not a permission approval path and must be resolved by the parent from contract or evidence."

[[invariants]]
id = "canonical-policy-no-shell-literals"
scope = "common"
contract = "permission-semantics"
statement = "Canonical policy contains semantic class identifiers and outcomes, not shell command literals; consumers own OpenCode pattern spelling and guarded API details."

[[intentional_differences]]
id = "build-authority"
role = "build"
field = "authority"

[[intentional_differences]]
id = "general-authority"
role = "general"
field = "authority"
